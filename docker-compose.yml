name: quikledgr

services:
  # 1. Database: MariaDB 11 LTS
  db:
    image: mariadb:11-jammy
    container_name: quikledgr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-quikledgr_root_secret_2026}
      MYSQL_DATABASE: ${DB_NAME:-quikledgr_db}
      MYSQL_USER: ${DB_USER:-quikledgr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quikledgr_secure_pass_2026}
    volumes:
      - quikledgr_db_data:/var/lib/mysql
      - ./backend/src/migrations/001_create_schema.sql:/docker-entrypoint-initdb.d/001_create_schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - quikledgr_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quikledgr-backend:latest
    container_name: quikledgr_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quikledgr_db}
      DB_USER: ${DB_USER:-quikledgr_user}
      DB_PASSWORD: ${DB_PASSWORD:-quikledgr_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-quikledgr_super_secure_jwt_token_key_change_in_production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - quikledgr_network

  # 3. Web: Nginx Reverse Proxy + Compiled React Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quikledgr-web:latest
    container_name: quikledgr_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8085}:80"
    networks:
      - quikledgr_network

volumes:
  quikledgr_db_data:
    driver: local

networks:
  quikledgr_network:
    driver: bridge
