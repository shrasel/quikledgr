<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickLedger — Enterprise Ledger & Smart Invoicing</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QuickLedger — Enterprise double-entry ledger, smart invoicing, and recipient client portal.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Theme Pre-Hydration Init (Default Light) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('quikledgr_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[#F1F5F9] dark:bg-[#1A222C] text-body dark:text-bodydark antialiased">
  <app-root></app-root>
</body>
</html>
